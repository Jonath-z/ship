name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: test -z "$(gofmt -l server)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:generated

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship
          POSTGRES_DB: ship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHIP_TEST_DATABASE_URL: postgres://ship:ship@localhost:5432/ship_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test -v ./server/internal/platform/database

  containers:
    runs-on: ubuntu-latest
    needs: [go, typescript]
    strategy:
      matrix:
        include:
          - image: ship-api
            dockerfile: infra/docker/api.Dockerfile
          - image: ship-worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: ship-web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
