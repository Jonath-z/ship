name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ship
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ship:ship@localhost:5432/ship?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SHIP_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SHIP_SESSION_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: test -z "$(gofmt -l server)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Test struct-driven migrations up and down
        env:
          SHIP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: go test ./server/internal/platform/database -run TestMigrationsUpAndDown
      - run: go run ./server/cmd/api -migrate-only
      - name: Test single-use owner setup
        env:
          SHIP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: go test ./server/internal/setup -run TestSetupSingleUseIntegration

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:generated

  containers:
    name: Container contract (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: ship-api
            dockerfile: infra/docker/api.Dockerfile
          - component: worker
            image: ship-worker
            dockerfile: infra/docker/worker.Dockerfile
          - component: web
            image: ship-web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read pinned build versions
        id: versions
        shell: bash
        run: |
          set -a
          source infra/versions.env
          set +a
          {
            echo "go_builder_image=${GO_BUILDER_IMAGE}"
            echo "node_image=${NODE_IMAGE}"
            echo "ruby_image=${RUBY_IMAGE}"
            echo "kamal_version=${KAMAL_VERSION}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build native test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: ${{ matrix.image }}:ci
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.versions.outputs.go_builder_image }}
            NODE_IMAGE=${{ steps.versions.outputs.node_image }}
            RUBY_IMAGE=${{ steps.versions.outputs.ruby_image }}
            KAMAL_VERSION=${{ steps.versions.outputs.kamal_version }}
            BUILD_SHA=${{ github.sha }}
            VERSION=ci
            SOURCE_URL=https://github.com/Jonath-z/ship
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify image contract
        run: ./scripts/test-image.sh "${{ matrix.image }}:ci" "${{ matrix.component }}"

  packaging:
    name: Installer and Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-self-installation.sh

  release-images:
    name: Release image (${{ matrix.image }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - server
      - web
      - containers
      - packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ship-api
            dockerfile: infra/docker/api.Dockerfile
          - image: ship-worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: ship-web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read pinned build versions
        id: versions
        shell: bash
        run: |
          set -a
          source infra/versions.env
          set +a
          {
            echo "go_builder_image=${GO_BUILDER_IMAGE}"
            echo "node_image=${NODE_IMAGE}"
            echo "ruby_image=${RUBY_IMAGE}"
            echo "kamal_version=${KAMAL_VERSION}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jonath-z/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/jonath-z/${{ matrix.image }}:latest
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.versions.outputs.go_builder_image }}
            NODE_IMAGE=${{ steps.versions.outputs.node_image }}
            RUBY_IMAGE=${{ steps.versions.outputs.ruby_image }}
            KAMAL_VERSION=${{ steps.versions.outputs.kamal_version }}
            BUILD_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            SOURCE_URL=https://github.com/Jonath-z/ship
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release-bundle:
    name: Release installer bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - server
      - web
      - containers
      - packaging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Package Compose and host CLI
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}" dist
      - name: Create or update GitHub release
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
