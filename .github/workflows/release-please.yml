name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      # The tag above is created with GITHUB_TOKEN, so its push event cannot
      # start the CI workflow; dispatch it explicitly at the tag ref to run the
      # test suite and publish images and installer bundles.
      - name: Run release pipeline for the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
