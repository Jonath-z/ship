# The production Ship control plane installed on a VPS (docs.md §39).
# ship-api serves the dashboard and the API on one public port; the SQLite
# database lives on the ./db bind mount shared with the worker.
name: ${SHIP_COMPOSE_PROJECT_NAME:-ship}

services:
  ship-api:
    image: ${SHIP_IMAGE_REGISTRY:-ghcr.io/jonath-z}/ship-api:${SHIP_VERSION:-v0.1.0}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      SHIP_ENV: production
      SHIP_HOSTNAME: ${SHIP_HOSTNAME:-localhost}
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:3000}
      SHIP_ALLOW_INSECURE_HTTP: ${SHIP_ALLOW_INSECURE_HTTP:-false}
      SHIP_TRUST_FORWARDED_IP: ${SHIP_TRUST_FORWARDED_IP:-false}
      SHIP_API_ADDR: :8080
      SHIP_WORKER_ADDR: :8081
      SHIP_DATA_DIR: /data/ship
      SHIP_DB_PATH: /data/db/ship.db
      SHIP_RUN_MIGRATIONS: "true"
      SHIP_LOG_LEVEL: ${SHIP_LOG_LEVEL:-info}
      SHIP_KEYRING_PATH: /run/ship/keys/keyring
      SHIP_SESSION_SECRET: ${SHIP_SESSION_SECRET:-}
      SHIP_SESSION_IDLE_TTL: ${SHIP_SESSION_IDLE_TTL:-24h}
      SHIP_SESSION_ABSOLUTE_TTL: ${SHIP_SESSION_ABSOLUTE_TTL:-168h}
      SHIP_FIRST_RUN_TOKEN_HASH: ${SHIP_FIRST_RUN_TOKEN_HASH:-}
      REDIS_URL: redis://ship-redis:6379/0
    ports:
      - "${SHIP_PORT:-3000}:8080"
    volumes:
      - ship_data:/data/ship:ro
      - ./db:/data/db
      - ./keys:/run/ship/keys:ro
    networks: [ship-edge, ship-data]
    depends_on:
      ship-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ship-api", "-healthcheck"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ship-worker:
    image: ${SHIP_IMAGE_REGISTRY:-ghcr.io/jonath-z}/ship-worker:${SHIP_VERSION:-v0.1.0}
    restart: unless-stopped
    init: true
    environment:
      SHIP_ENV: production
      SHIP_HOSTNAME: ${SHIP_HOSTNAME:-localhost}
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:3000}
      SHIP_ALLOW_INSECURE_HTTP: ${SHIP_ALLOW_INSECURE_HTTP:-false}
      SHIP_API_ADDR: :8080
      SHIP_WORKER_ADDR: :8081
      SHIP_DATA_DIR: /data/ship
      SHIP_DB_PATH: /data/db/ship.db
      SHIP_LOG_LEVEL: ${SHIP_LOG_LEVEL:-info}
      SHIP_KEYRING_PATH: /run/ship/keys/keyring
      REDIS_URL: redis://ship-redis:6379/0
      HOME: /home/ship
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ship_data:/data/ship
      - ./db:/data/db
      - ./keys:/run/ship/keys:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ship-edge, ship-data]
    depends_on:
      ship-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ship-worker", "-healthcheck"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /home/ship:uid=10001,gid=10001,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ship-redis:
    image: ${REDIS_IMAGE:-redis:7.4.11-alpine3.21}
    user: "999:1000"
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks: [ship-data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /data:uid=999,gid=1000,mode=0700
      - /tmp:mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  ship-edge:
  ship-data:
    internal: true

volumes:
  ship_data:
