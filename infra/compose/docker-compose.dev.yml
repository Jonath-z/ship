name: ship-dev

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${SHIP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/docker/go.dev.Dockerfile
    command: air -c server/.air.api.toml
    working_dir: /workspace
    environment:
      SHIP_ENV: development
      SHIP_HOSTNAME: ${SHIP_HOSTNAME:-localhost}
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:3000}
      SHIP_ALLOW_INSECURE_HTTP: "true"
      SHIP_TRUST_FORWARDED_IP: "false"
      SHIP_API_ADDR: :8080
      SHIP_WORKER_ADDR: :8081
      SHIP_DATA_DIR: ${SHIP_DATA_DIR:-./data/ship}
      SHIP_RUN_MIGRATIONS: "true"
      SHIP_LOG_LEVEL: debug
      SHIP_SESSION_SECRET: ${SHIP_SESSION_SECRET:-ship-development-session-secret-do-not-use}
      SHIP_FIRST_RUN_TOKEN_HASH: ${SHIP_FIRST_RUN_TOKEN_HASH:-1a0908b6d12c232748a798bb54106434be4fe99e9aa0dbb6ab8174d402424acb}
      SHIP_MASTER_KEY: ${SHIP_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${SHIP_API_PORT:-8080}:8080"
    volumes:
      - ../..:/workspace
      - ship_go_cache:/go/pkg/mod
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/go.dev.Dockerfile
    command: air -c server/.air.worker.toml
    working_dir: /workspace
    environment:
      SHIP_ENV: development
      SHIP_HOSTNAME: ${SHIP_HOSTNAME:-localhost}
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:3000}
      SHIP_ALLOW_INSECURE_HTTP: "true"
      SHIP_API_ADDR: :8080
      SHIP_WORKER_ADDR: :8081
      SHIP_DATA_DIR: ${SHIP_DATA_DIR:-./data/ship}
      SHIP_LOG_LEVEL: debug
      SHIP_MASTER_KEY: ${SHIP_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${SHIP_WORKER_PORT:-8081}:8081"
    volumes:
      - ../..:/workspace
      - ship_go_cache:/go/pkg/mod
      # Kamal builds run in this container; the CLI needs the host daemon,
      # matching the production worker mount.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.dev.Dockerfile
    command: sh -c "pnpm install --offline --frozen-lockfile && pnpm --filter @ship/web dev"
    working_dir: /workspace
    environment:
      NEXT_DIST_DIR: .next-dev
      # next dev proxies /api/* here; production serves the exported files
      # straight from ship-api and runs no Node server.
      SHIP_API_URL: http://api:8080
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${SHIP_WEB_PORT:-3000}:3000"
    volumes:
      - ../..:/workspace
      - ship_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  ship_go_cache:
  ship_node_modules:
