service: acme-production-api
image: acme/api:v1
builder:
    arch:
        - amd64
        - arm64
servers:
    web:
        hosts:
            - 203.0.113.10
            - 203.0.113.11
            - 203.0.113.12
        cmd: bin/server
ssh:
    user: deploy
    port: 2222
    keys:
        - .kamal/ssh_key
proxy:
    hosts:
        - api.example.com
        - www.example.com
    ssl: false
    app_port: 3000
env:
    clear:
        LOG_LEVEL: info
