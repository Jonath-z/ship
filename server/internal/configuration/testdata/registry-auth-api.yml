service: acme-production-api
image: ghcr.io/acme/api:v1
registry:
    server: ghcr.io
    username:
        - KAMAL_REGISTRY_USERNAME
    password:
        - KAMAL_REGISTRY_PASSWORD
builder:
    arch: amd64
servers:
    web:
        hosts:
            - 203.0.113.10
ssh:
    user: root
    keys:
        - .kamal/ssh_key
proxy:
    ssl: false
    app_port: 3000
env:
    clear:
        LOG_LEVEL: info
    secret:
        - APP_KEY
