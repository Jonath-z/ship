openapi: 3.1.0
info:
  title: Ship API
  version: 0.1.0
  description: The contract exposed by the Ship control-plane API.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      x-ship-permission: public
      summary: Check process and dependency health
      responses:
        "200":
          description: The process and its dependencies are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /system:
    get:
      operationId: getSystemStatus
      x-ship-permission: system.read
      security: [{ sessionCookie: [] }]
      summary: Get live Ship, dependency, machine, and runtime status
      responses:
        "200":
          description: A point-in-time view of the Ship control plane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /setup:
    get:
      operationId: getSetupStatus
      x-ship-permission: setup
      summary: Check whether the single-use owner setup is required
      responses:
        "200":
          description: Current setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          description: Setup status could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOwner
      x-ship-permission: setup
      summary: Create the first and only bootstrap owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOwnerRequest"
      responses:
        "201":
          description: Owner account created and setup permanently disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOwner"
        "400":
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: First-run token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Setup was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Owner account could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      x-ship-permission: public
      summary: Authenticate a local account and start a server-side session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Email or password is incorrect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Login is temporarily rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/session:
    get:
      operationId: getSession
      x-ship-permission: authenticated
      security: [{ sessionCookie: [] }]
      summary: Get the current user and session-bound CSRF token
      responses:
        "200":
          description: Current authenticated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/logout:
    post:
      operationId: logout
      x-ship-permission: authenticated
      security: [{ sessionCookie: [] }]
      summary: Destroy the current server-side session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Session destroyed. }
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: CSRF validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/password:
    post:
      operationId: changePassword
      x-ship-permission: authenticated
      security: [{ sessionCookie: [] }]
      summary: Change the current user's password and rotate their session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed and replacement session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: CSRF validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users:
    get:
      operationId: listUsers
      x-ship-permission: users.read
      security: [{ sessionCookie: [] }]
      summary: List local accounts
      responses:
        "200":
          description: Local accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "403":
          description: Permission denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createUser
      x-ship-permission: users.manage
      security: [{ sessionCookie: [] }]
      summary: Create a local account
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403":
          description: Permission denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{id}/role:
    patch:
      operationId: changeUserRole
      x-ship-permission: users.manage
      security: [{ sessionCookie: [] }]
      summary: Change a local account role
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403":
          description: Permission denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{id}:
    delete:
      operationId: disableUser
      x-ship-permission: users.manage
      security: [{ sessionCookie: [] }]
      summary: Disable a local account and invalidate its sessions
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Account disabled. }
        "403":
          description: Permission denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The last active owner cannot be disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /audit:
    get:
      operationId: listAuditEvents
      x-ship-permission: audit.read
      security: [{ sessionCookie: [] }]
      summary: List append-only audit events
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - {
            name: actorUserId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Filtered audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "403":
          description: Permission denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      x-ship-permission: public
      summary: Get the Ship OpenAPI contract
      responses:
        "200":
          description: OpenAPI YAML.
          content:
            application/yaml:
              schema: { type: string }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ship_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
    Health:
      type: object
      required: [status, component, buildSha, version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        component:
          type: string
        buildSha:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DependencyHealth"
    ComponentStatus:
      type: object
      required: [status, detail]
      properties:
        status:
          type: string
          enum: [ok, error, unknown]
        detail:
          type: string
        lastSeenAt:
          type: string
          format: date-time
    SystemConfiguration:
      type: object
      required:
        - environment
        - hostname
        - publicUrl
        - secureTransport
        - insecureBootstrap
        - apiAddress
        - workerAddress
        - dataDirectory
        - logLevel
        - migrationsOnStart
        - sensitiveValuesHidden
      properties:
        environment: { type: string }
        hostname: { type: string }
        publicUrl: { type: string, format: uri }
        secureTransport: { type: boolean }
        insecureBootstrap: { type: boolean }
        apiAddress: { type: string }
        workerAddress: { type: string }
        dataDirectory: { type: string }
        logLevel: { type: string }
        migrationsOnStart: { type: boolean }
        sensitiveValuesHidden: { type: boolean }
    CPUStatus:
      type: object
      required: [logicalCores, physicalCores, usedPercent, load1, load5, load15]
      properties:
        logicalCores: { type: integer }
        physicalCores: { type: integer }
        usedPercent: { type: number, format: double }
        load1: { type: number, format: double }
        load5: { type: number, format: double }
        load15: { type: number, format: double }
    MemoryStatus:
      type: object
      required: [totalBytes, availableBytes, usedBytes, usedPercent]
      properties:
        totalBytes: { type: integer, format: int64 }
        availableBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        usedPercent: { type: number, format: double }
    DiskStatus:
      type: object
      required: [path, totalBytes, freeBytes, usedBytes, usedPercent]
      properties:
        path: { type: string }
        totalBytes: { type: integer, format: int64 }
        freeBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        usedPercent: { type: number, format: double }
    MachineStatus:
      type: object
      required:
        - scope
        - hostname
        - operatingSystem
        - platform
        - platformVersion
        - kernelVersion
        - architecture
        - virtualizationSystem
        - virtualizationRole
        - uptimeSeconds
        - cpu
        - memory
        - disk
      properties:
        scope: { type: string }
        hostname: { type: string }
        operatingSystem: { type: string }
        platform: { type: string }
        platformVersion: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        virtualizationSystem: { type: string }
        virtualizationRole: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        cpu:
          $ref: "#/components/schemas/CPUStatus"
        memory:
          $ref: "#/components/schemas/MemoryStatus"
        disk:
          $ref: "#/components/schemas/DiskStatus"
    RuntimeStatus:
      type: object
      required:
        - goVersion
        - goOs
        - goArchitecture
        - processId
        - uptimeSeconds
        - goroutines
        - heapAllocatedBytes
        - systemMemoryBytes
        - buildSha
        - version
      properties:
        goVersion: { type: string }
        goOs: { type: string }
        goArchitecture: { type: string }
        processId: { type: integer }
        uptimeSeconds: { type: integer, format: int64 }
        goroutines: { type: integer }
        heapAllocatedBytes: { type: integer, format: int64 }
        systemMemoryBytes: { type: integer, format: int64 }
        buildSha: { type: string }
        version: { type: string }
    SystemStatus:
      type: object
      required:
        [
          status,
          collectedAt,
          components,
          configuration,
          machine,
          runtime,
          warnings,
        ]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        collectedAt:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
        configuration:
          $ref: "#/components/schemas/SystemConfiguration"
        machine:
          $ref: "#/components/schemas/MachineStatus"
        runtime:
          $ref: "#/components/schemas/RuntimeStatus"
        warnings:
          type: array
          items: { type: string }
    SetupStatus:
      type: object
      required: [required, tokenConfigured, hostname]
      properties:
        required: { type: boolean }
        tokenConfigured: { type: boolean }
        hostname: { type: string }
    SetupOwnerRequest:
      type: object
      required: [token, email, password]
      properties:
        token:
          type: string
          minLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
    SetupOwner:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner]
    Role:
      type: string
      enum: [owner, admin, deployer, viewer]
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
    ManagedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled, createdAt]
          properties:
            disabled: { type: boolean }
            createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedUser" }
    AuditEntry:
      type: object
      required: [id, action, resourceType, outcome, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        actorEmail: { type: string, format: email }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        outcome: { type: string, enum: [success, failure] }
        sourceIp: { type: string }
        requestId: { type: string }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor: { type: string }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
