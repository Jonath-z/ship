openapi: 3.1.0
info:
  title: Ship API
  version: 0.1.0
  description: The contract exposed by the Ship control-plane API.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process and dependency health
      responses:
        "200":
          description: The process and its dependencies are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /system:
    get:
      operationId: getSystemStatus
      summary: Get live Ship, dependency, machine, and runtime status
      responses:
        "200":
          description: A point-in-time view of the Ship control plane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /setup:
    get:
      operationId: getSetupStatus
      summary: Check whether the single-use owner setup is required
      responses:
        "200":
          description: Current setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          description: Setup status could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOwner
      summary: Create the first and only bootstrap owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOwnerRequest"
      responses:
        "201":
          description: Owner account created and setup permanently disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOwner"
        "400":
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: First-run token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Setup was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Owner account could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
    Health:
      type: object
      required: [status, component, buildSha, version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        component:
          type: string
        buildSha:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DependencyHealth"
    ComponentStatus:
      type: object
      required: [status, detail]
      properties:
        status:
          type: string
          enum: [ok, error, unknown]
        detail:
          type: string
        lastSeenAt:
          type: string
          format: date-time
    SystemConfiguration:
      type: object
      required:
        - environment
        - hostname
        - apiAddress
        - workerAddress
        - dataDirectory
        - logLevel
        - migrationsOnStart
        - sensitiveValuesHidden
      properties:
        environment: { type: string }
        hostname: { type: string }
        apiAddress: { type: string }
        workerAddress: { type: string }
        dataDirectory: { type: string }
        logLevel: { type: string }
        migrationsOnStart: { type: boolean }
        sensitiveValuesHidden: { type: boolean }
    CPUStatus:
      type: object
      required: [logicalCores, physicalCores, usedPercent, load1, load5, load15]
      properties:
        logicalCores: { type: integer }
        physicalCores: { type: integer }
        usedPercent: { type: number, format: double }
        load1: { type: number, format: double }
        load5: { type: number, format: double }
        load15: { type: number, format: double }
    MemoryStatus:
      type: object
      required: [totalBytes, availableBytes, usedBytes, usedPercent]
      properties:
        totalBytes: { type: integer, format: int64 }
        availableBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        usedPercent: { type: number, format: double }
    DiskStatus:
      type: object
      required: [path, totalBytes, freeBytes, usedBytes, usedPercent]
      properties:
        path: { type: string }
        totalBytes: { type: integer, format: int64 }
        freeBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        usedPercent: { type: number, format: double }
    MachineStatus:
      type: object
      required:
        - scope
        - hostname
        - operatingSystem
        - platform
        - platformVersion
        - kernelVersion
        - architecture
        - virtualizationSystem
        - virtualizationRole
        - uptimeSeconds
        - cpu
        - memory
        - disk
      properties:
        scope: { type: string }
        hostname: { type: string }
        operatingSystem: { type: string }
        platform: { type: string }
        platformVersion: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        virtualizationSystem: { type: string }
        virtualizationRole: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        cpu:
          $ref: "#/components/schemas/CPUStatus"
        memory:
          $ref: "#/components/schemas/MemoryStatus"
        disk:
          $ref: "#/components/schemas/DiskStatus"
    RuntimeStatus:
      type: object
      required:
        - goVersion
        - goOs
        - goArchitecture
        - processId
        - uptimeSeconds
        - goroutines
        - heapAllocatedBytes
        - systemMemoryBytes
        - buildSha
        - version
      properties:
        goVersion: { type: string }
        goOs: { type: string }
        goArchitecture: { type: string }
        processId: { type: integer }
        uptimeSeconds: { type: integer, format: int64 }
        goroutines: { type: integer }
        heapAllocatedBytes: { type: integer, format: int64 }
        systemMemoryBytes: { type: integer, format: int64 }
        buildSha: { type: string }
        version: { type: string }
    SystemStatus:
      type: object
      required:
        [
          status,
          collectedAt,
          components,
          configuration,
          machine,
          runtime,
          warnings,
        ]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        collectedAt:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
        configuration:
          $ref: "#/components/schemas/SystemConfiguration"
        machine:
          $ref: "#/components/schemas/MachineStatus"
        runtime:
          $ref: "#/components/schemas/RuntimeStatus"
        warnings:
          type: array
          items: { type: string }
    SetupStatus:
      type: object
      required: [required, tokenConfigured, hostname]
      properties:
        required: { type: boolean }
        tokenConfigured: { type: boolean }
        hostname: { type: string }
    SetupOwnerRequest:
      type: object
      required: [token, email, password]
      properties:
        token:
          type: string
          minLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
    SetupOwner:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
